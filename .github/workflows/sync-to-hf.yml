# Deploy main to the Hugging Face Space so pushing to GitHub still auto-deploys.
# HF rejects plain-git binary files over ~1MB (bgm.mp3), so instead of mirroring
# history we push a single orphan snapshot commit with *.mp3 tracked via LFS.
# One-time setup in the GitHub repo settings:
#   - Secret  HF_TOKEN: a HF access token with "write" scope (hf.co/settings/tokens)
#   - Variable HF_SPACE: the Space id, e.g. "Pipatchai/Slave"
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Push snapshot to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git lfs install --local
          git checkout --orphan hf-deploy
          git lfs track "*.mp3"
          git add --renormalize .
          git add .gitattributes
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf-deploy:main
