# Mirror main to the Hugging Face Space so pushing to GitHub still auto-deploys.
# One-time setup in the GitHub repo settings:
#   - Secret  HF_TOKEN: a HF access token with "write" scope (hf.co/settings/tokens)
#   - Variable HF_SPACE: the Space id, e.g. "your-username/slave"
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # HF rejects shallow pushes
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
